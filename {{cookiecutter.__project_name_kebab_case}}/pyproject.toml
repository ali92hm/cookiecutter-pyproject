[project]
authors = [
  {name = "{{ cookiecutter.author_full_name }}", email = "{{ cookiecutter.author_email }}"},
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]

dependencies = [
  # fill me
]
description = "{{ cookiecutter.project_description }}"
dynamic = ["version"]
keywords = [
  # fill me
]
{% if cookiecutter.license != 'Not open source' -%}
license = "{{ cookiecutter._spdx_license_map[cookiecutter.license] }}"
license-files = ["LICENSE"]
{% endif -%}
maintainers = [
  {name = "{{ cookiecutter.author_full_name }}", email = "{{ cookiecutter.author_email }}"},
]
name = "{{ cookiecutter.__project_name_kebab_case }}"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.11"

[project.urls]
changelog = "{{ cookiecutter.project_repo }}/blob/master/CHANGELOG.md"
documentation = "{{ cookiecutter.project_repo }}/blob/master/README.md"
homepage = "{{ cookiecutter.project_repo }}"
repository = "{{ cookiecutter.project_repo }}"

[project.scripts]
{{ cookiecutter.__project_name_kebab_case }} = "{{ cookiecutter.__project_name_snake_case }}.cli.entrypoint:main"

[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=65",
  "wheel>=0.38",
]

[tool.setuptools.dynamic]
version = {attr = "{{ cookiecutter.__project_name_snake_case }}.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["{{ cookiecutter.__project_name_snake_case }}*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = [
  "tests",
]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W"]
ignore = ["E203"]

[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.mypy]
check_untyped_defs = true
disallow_any_generics = true
disallow_untyped_defs = true
follow_imports = "silent"
ignore_missing_imports = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
ignore_errors = true
module = "tests.*"

[tool.coverage.run]
source = ["{{ cookiecutter.__project_name_snake_case }}"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
