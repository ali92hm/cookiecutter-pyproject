[project]
authors = [
  {name = "Ali Hajimirza (ali92hm)", email = "ali@alihm.net"},
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
]
dependencies = []
description = "A cookiecutter for generating a basic scaffolding for python projects"
dynamic = ["version"]
keywords = ["cookiecutter", "python", "project", "generator"]
license = "MIT"
license-files = ["LICENSE"]
maintainers = [
  {name = "Ali Hajimirza (ali92hm)", email = "ali@alihm.net"},
]
name = "cookiecutter-pyproject"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.11"

[project.urls]
changelog = "https://github.com/ali92hm/cookiecutter-pyproject/blob/master/CHANGELOG.md"
documentation = "https://github.com/ali92hm/cookiecutter-pyproject/blob/master/README.md"
homepage = "https://github.com/ali92hm/cookiecutter-pyproject"
repository = "https://github.com/ali92hm/cookiecutter-pyproject"

[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=65",
  "wheel>=0.38",
]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
where = ["."]
include = ["hooks*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
addopts = "--basetemp=.generated --keep-baked-projects"
testpaths = [
  "tests",
]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["docs", ".generated", '\{\{cookiecutter.__project_name_kebab_case\}\}']

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W"]
ignore = ["E203"]

[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.mypy]
check_untyped_defs = true
disallow_any_generics = true
disallow_untyped_defs = true
exclude = "{{cookiecutter.__project_name_kebab_case}}/"
follow_imports = "silent"
ignore_missing_imports = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
ignore_errors = true
module = "tests.*"

[tool.coverage.run]
source = ["hooks"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
